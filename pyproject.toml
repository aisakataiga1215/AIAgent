[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-ai"
version = "0.1.0"
description = "Multi-Agent development workflow system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "aisakataiga1215"}
]

dependencies = [
    "anthropic>=0.39.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
devflow = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "frontend", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
